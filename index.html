<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kedai Kopi Santai</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f5f0;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #6f4e37;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    form {
      background: #fff;
      padding: 20px;
      max-width: 500px;
      margin: 20px auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      background-color: #6f4e37;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .map-container {
      max-width: 500px;
      margin: 0 auto;
      padding-top: 20px;
    }
    iframe {
      width: 100%;
      height: 300px;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kedai Kopi Santai</h1>
    <p>Tempat nongkrong paling nyaman di kota!</p>
  </header>

  <main>
    <h2>Hubungi Kami</h2>
    <form id="contactForm">
      <label>Email:</label>
      <input type="email" id="email" required>

      <label>Password:</label>
      <input type="password" id="password" required>

      <label>Nomor Telepon:</label>
      <input type="tel" id="phone" required>

      <label>Alamat:</label>
      <textarea id="alamat" rows="3" required></textarea>

      <button type="submit">Kirim</button>
    </form>

    <div class="map-container">
      <h3>Lokasi Anda</h3>
      <iframe id="map" src="" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </main>

  <script>
    const form = document.getElementById('contactForm');
    const map = document.getElementById('map');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const alamat = document.getElementById('alamat').value;
      const query = encodeURIComponent(alamat);
      const mapUrl = `https://www.google.com/maps?q=${query}&output=embed`;
      map.src = mapUrl;
    });
  </script>
</body>
</html>
